name: Operational Proof (live server)

# Controlled-environment operational proof. Boots the real UltronPro API (background
# loops + local LLM autostart disabled), points the language layer at a deterministic
# neutral mock, and runs scratch/operational_proof.py in short mode (pauses=0).
# In mock mode it asserts the LLM-independent invariants: completion, zero runtime
# crashes, zero unsafe actions, zero empty responses, and route accuracy >= floor.
# Designed as a ~1h soak; here it runs in well under a minute with pauses disabled.
#
# Not a PR gate (nightly + manual). Grade answer accuracy too by dispatching with
# real_llm=1 against a real endpoint.

on:
  schedule:
    - cron: "17 4 * * *"   # nightly 04:17 UTC
  workflow_dispatch:
    inputs:
      real_llm:
        description: "Set 1 to grade against a real LLM endpoint (full criteria)"
        required: false
        default: "0"
      max_tasks:
        description: "Cap tasks per phase (0 = full task set)"
        required: false
        default: "0"
      min_route_acc:
        description: "Minimum route_accuracy_end floor (mock mode)"
        required: false
        default: "0.90"

permissions:
  contents: read

jobs:
  operational-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run operational proof (controlled env, short mode)
        env:
          ULTRON_PROOF_REAL_LLM: ${{ github.event.inputs.real_llm || '0' }}
          ULTRON_PROOF_MAX_TASKS: ${{ github.event.inputs.max_tasks || '0' }}
          ULTRON_PROOF_MIN_ROUTE_ACC: ${{ github.event.inputs.min_route_acc || '0.90' }}
          ULTRON_PROOF_SERVER_PORT: "8000"
          MOCK_LLM_PORT: "11434"
          ULTRON_PROOF_BOOT_TIMEOUT: "150"
        run: python tools/ci_operational_proof.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-proof-report
          path: |
            backend/data/ci_operational_proof_report.json
            backend/scratch/operational_proof_report.json
          if-no-files-found: ignore
